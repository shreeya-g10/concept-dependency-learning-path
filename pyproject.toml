[project]
name = "concept-dependency-learning-path"
version = "0.1.0"
description = "Agent-validated prerequisite graphs and student-adaptive learning paths"
requires-python = ">=3.10"

# Everyone uses the same formatter settings so diffs only show real changes.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
# Each module has its own tests/ folder; importlib mode stops same-named test files clashing.
addopts = "--import-mode=importlib"
testpaths = ["cdlp", "website"]
