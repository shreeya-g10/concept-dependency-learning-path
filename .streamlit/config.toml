# Calm pastel lavender, high contrast. website/test_foundation.py checks the contrast ratios.
[theme]
base = "light"
primaryColor = "#4B3F8F"
backgroundColor = "#F4F2FB"
secondaryBackgroundColor = "#E6E2F6"
textColor = "#1F1B3D"
linkColor = "#4B3F8F"
borderColor = "#6A6494"
font = "sans-serif"
baseFontSize = 18
baseRadius = "medium"
buttonRadius = "medium"

[client]
# No developer menu for students.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
